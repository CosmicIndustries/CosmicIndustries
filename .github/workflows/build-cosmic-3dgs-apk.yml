name: Cosmic Aircraft Capture Android APK

on:
  push:
    branches:
      - build/cosmic-3dgs-apk-20261103
      - build/cosmic-aircraft-capture-003
      - build/cosmic-aircraft-capture-004
    tags:
      - "capture*"
    paths:
      - "cosmic-3dgs-android/**"
      - ".github/workflows/build-cosmic-3dgs-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        working-directory: cosmic-3dgs-android
        run: gradle --no-daemon --max-workers=2 --stacktrace :app:assembleDebug

      - name: Verify APK
        working-directory: cosmic-3dgs-android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Cosmic-Aircraft-Capture-Build004-APK
          path: cosmic-3dgs-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/capture')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="Cosmic-Aircraft-Capture-0.4.0.apk"
          cp cosmic-3dgs-android/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          for i in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" "$OUT" -R "$GITHUB_REPOSITORY" --clobber
